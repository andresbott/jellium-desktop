name: build-linux-appimage

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version string (e.g. 1.2.0); sets JFN_VERSION"
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: "Version string to embed (sets JFN_VERSION)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      JFN_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-${{ matrix.arch }}

      - name: Build AppImage
        run: ./dev/linux/appimage/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: dist/JelliumDesktop-*.AppImage
