name: build-linux-flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version string (e.g. 1.2.0); sets JFN_VERSION"
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: "Version string to embed (sets JFN_VERSION)"
        required: false
        type: string

concurrency:
  group: build-linux-flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JFN_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install SDK
        run: |
          flatpak install --user -y flathub \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Build Flatpak
        run: ./dev/linux/flatpak/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak-x86_64
          path: dist/JelliumDesktop-*.flatpak
